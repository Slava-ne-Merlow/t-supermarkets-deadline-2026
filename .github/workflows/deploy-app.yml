name: Deploy Mini App

on:
  push:
    branches: [ "main" ]
    paths:
      - "services/app-backend/**"
      - "services/app-frontend/**"
      - "infra/app-server/**"
      - ".github/workflows/deploy-app.yml"
      - "README.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_SSH_PORT: ${{ secrets.APP_SSH_PORT || '2002' }}
      APP_DIR: /opt/miniapp
      IMAGE_ARCHIVE: miniapp-images.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t miniapp-backend:latest \
            -t miniapp-backend:${{ github.sha }} \
            services/app-backend

      - name: Build frontend image
        run: |
          docker build \
            -t miniapp-frontend:latest \
            -t miniapp-frontend:${{ github.sha }} \
            services/app-frontend

      - name: Pack images
        run: |
          docker pull caddy:2-alpine
          docker tag caddy:2-alpine miniapp-caddy:latest
          docker save \
            miniapp-backend:latest \
            miniapp-backend:${{ github.sha }} \
            miniapp-frontend:latest \
            miniapp-frontend:${{ github.sha }} \
            miniapp-caddy:latest \
            | gzip > "$IMAGE_ARCHIVE"

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.APP_SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          if grep -q '\\n' ~/.ssh/id_ed25519; then
            perl -0pi -e 's/\\n/\n/g' ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -p "$APP_SSH_PORT" -H "${{ secrets.APP_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deploy bundle
        run: |
          SSH_CMD="ssh -i ~/.ssh/id_ed25519 -p $APP_SSH_PORT -o IdentitiesOnly=yes -o PreferredAuthentications=publickey"
          TARGET="${{ secrets.APP_USER }}@${{ secrets.APP_HOST }}"

          $SSH_CMD "$TARGET" "mkdir -p '$APP_DIR/deploy'"

          rsync -az \
            -e "$SSH_CMD" \
            "$IMAGE_ARCHIVE" \
            infra/app-server/deploy.sh \
            "$TARGET:$APP_DIR/deploy/"

      - name: Run deploy script
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$APP_SSH_PORT" -o IdentitiesOnly=yes -o PreferredAuthentications=publickey "${{ secrets.APP_USER }}@${{ secrets.APP_HOST }}" "
            APP_DIR='$APP_DIR' \
            IMAGE_ARCHIVE='$APP_DIR/deploy/$IMAGE_ARCHIVE' \
            bash '$APP_DIR/deploy/deploy.sh'
          "
