name: Deploy Mini App

on:
  push:
    branches: [ "main" ]
    paths:
      - "services/app-backend/**"
      - "services/app-frontend/**"
      - "infra/app-server/**"
      - ".github/workflows/deploy-app.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_SSH_PORT: ${{ secrets.APP_SSH_PORT || '2002' }}
      APP_DIR: /opt/miniapp
      IMAGE_ARCHIVE: miniapp-images.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed parts
        id: changes
        run: |
          before="${{ github.event.before }}"

          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"
          fi

          printf '%s\n' "$changed_files"

          backend_changed=false
          frontend_changed=false
          caddy_changed=false

          if printf '%s\n' "$changed_files" | grep -q '^services/app-backend/'; then
            backend_changed=true
          fi

          if printf '%s\n' "$changed_files" | grep -q '^services/app-frontend/'; then
            frontend_changed=true
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(infra/app-server/deploy\.sh|\.github/workflows/deploy-app\.yml)$'; then
            caddy_changed=true
          fi

          if [ "$backend_changed" = true ] || [ "$frontend_changed" = true ] || [ "$caddy_changed" = true ]; then
            image_changed=true
          else
            image_changed=false
          fi

          {
            echo "backend=$backend_changed"
            echo "frontend=$frontend_changed"
            echo "caddy=$caddy_changed"
            echo "image=$image_changed"
          } >> "$GITHUB_OUTPUT"

      - name: Build backend image
        if: steps.changes.outputs.backend == 'true'
        run: |
          docker build \
            -t miniapp-backend:latest \
            -t miniapp-backend:${{ github.sha }} \
            services/app-backend

      - name: Build frontend image
        if: steps.changes.outputs.frontend == 'true'
        run: |
          docker build \
            -t miniapp-frontend:latest \
            -t miniapp-frontend:${{ github.sha }} \
            services/app-frontend

      - name: Pull Caddy image
        if: steps.changes.outputs.caddy == 'true'
        run: |
          docker pull caddy:2-alpine
          docker tag caddy:2-alpine miniapp-caddy:latest

      - name: Pack images
        if: steps.changes.outputs.image == 'true'
        run: |
          images=()

          if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
            images+=("miniapp-backend:latest" "miniapp-backend:${{ github.sha }}")
          fi

          if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
            images+=("miniapp-frontend:latest" "miniapp-frontend:${{ github.sha }}")
          fi

          if [ "${{ steps.changes.outputs.caddy }}" = "true" ]; then
            images+=("miniapp-caddy:latest")
          fi

          docker save "${images[@]}" | gzip > "$IMAGE_ARCHIVE"

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.APP_SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          if grep -q '\\n' ~/.ssh/id_ed25519; then
            perl -0pi -e 's/\\n/\n/g' ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -p "$APP_SSH_PORT" -H "${{ secrets.APP_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deploy bundle
        run: |
          SSH_CMD="ssh -i ~/.ssh/id_ed25519 -p $APP_SSH_PORT -o IdentitiesOnly=yes -o PreferredAuthentications=publickey"
          TARGET="${{ secrets.APP_USER }}@${{ secrets.APP_HOST }}"

          $SSH_CMD "$TARGET" "mkdir -p '$APP_DIR/deploy' && rm -f '$APP_DIR/deploy/$IMAGE_ARCHIVE'"

          files=(infra/app-server/deploy.sh)
          if [ -f "$IMAGE_ARCHIVE" ]; then
            files+=("$IMAGE_ARCHIVE")
          fi

          rsync -az -e "$SSH_CMD" "${files[@]}" "$TARGET:$APP_DIR/deploy/"

      - name: Run deploy script
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$APP_SSH_PORT" -o IdentitiesOnly=yes -o PreferredAuthentications=publickey "${{ secrets.APP_USER }}@${{ secrets.APP_HOST }}" "
            APP_DIR='$APP_DIR' \
            IMAGE_ARCHIVE='$APP_DIR/deploy/$IMAGE_ARCHIVE' \
            bash '$APP_DIR/deploy/deploy.sh'
          "
