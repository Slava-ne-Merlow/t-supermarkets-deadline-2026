name: Deploy Mini App

on:
  push:
    branches: [ "main" ]
    paths:
      - "services/app-backend/**"
      - "services/app-frontend/**"
      - "infra/app-server/**"
      - ".github/workflows/deploy-app.yml"
      - "README.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_SSH_PORT: ${{ secrets.APP_SSH_PORT || '2002' }}
      APP_DIR: /opt/miniapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.APP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$APP_SSH_PORT" -H "${{ secrets.APP_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload repo to server
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$APP_SSH_PORT" "${{ secrets.APP_USER }}@${{ secrets.APP_HOST }}" "mkdir -p '$APP_DIR/repo'"

          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".gradle/" \
            --exclude ".angular/" \
            --exclude "build/" \
            --exclude "dist/" \
            --exclude "node_modules/" \
            --exclude ".env" \
            -e "ssh -i ~/.ssh/id_ed25519 -p $APP_SSH_PORT" \
            ./ \
            "${{ secrets.APP_USER }}@${{ secrets.APP_HOST }}:$APP_DIR/repo/"

      - name: Run deploy script
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$APP_SSH_PORT" "${{ secrets.APP_USER }}@${{ secrets.APP_HOST }}" "
            mkdir -p '$APP_DIR/repo' &&
            cd '$APP_DIR/repo' &&
            APP_DIR='$APP_DIR' bash infra/app-server/deploy.sh
          "
