services:
  app-backend:
    image: miniapp-backend:latest
    container_name: miniapp-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_USERNAME: "${TELEGRAM_USERNAME:-MiniAppBot}"
      APP_FRONTEND_URL: "${APP_FRONTEND_URL:-http://144.31.68.159:8082}"
      APP_START_TEXT: "${APP_START_TEXT:-Привет! Открой мини-приложение по кнопке ниже.}"
    ports:
      - "8081:8080"

  app-frontend:
    image: miniapp-frontend:latest
    container_name: miniapp-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
