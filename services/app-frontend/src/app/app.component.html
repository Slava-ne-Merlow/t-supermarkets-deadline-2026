<tui-root>
  <main class="miniapp-shell">
    <section class="panel" tuiCardLarge>
      <div class="app-mark">MA</div>

      <div class="intro">
        <p class="eyebrow">Telegram Mini App</p>
        <h1>Миниапа открыта</h1>
        <p class="status">
          @if (launchedInTelegram) {
            Запущено внутри Telegram
          } @else {
            Локальный режим
          }
        </p>
      </div>

      <div class="user-card" tuiCardMedium>
        <span>Пользователь</span>
        <strong>{{ displayName }}</strong>
        <small>{{ username }}</small>
      </div>

      <div class="meta-grid">
        <div tuiCardMedium>
          <span>Платформа</span>
          <strong>{{ platform }}</strong>
        </div>
        <div tuiCardMedium>
          <span>Тема</span>
          <strong>{{ colorScheme }}</strong>
        </div>
        <div tuiCardMedium>
          <span>SDK</span>
          <strong>{{ version }}</strong>
        </div>
      </div>

      <div class="actions">
        <button tuiButton type="button" appearance="primary" size="m" (click)="markReady()">Готово</button>
        @if (launchedInTelegram) {
          <button tuiButton type="button" appearance="secondary" size="m" (click)="close()">Закрыть</button>
        }
      </div>
    </section>
  </main>
</tui-root>
